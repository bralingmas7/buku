name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo ini hanya berisi kode Dart. Folder android/ dibuat otomatis di sini.
      # lib/, test/, dan pubspec.yaml dicadangkan dulu supaya tidak tertimpa.
      - name: Buat scaffold Android
        run: |
          mkdir -p "$RUNNER_TEMP/bak"
          cp -r lib test pubspec.yaml "$RUNNER_TEMP/bak/"
          flutter create --platforms=android --org id.warung --project-name buku_utang_warung .
          rm -rf lib test pubspec.yaml
          cp -r "$RUNNER_TEMP/bak/lib" lib
          cp -r "$RUNNER_TEMP/bak/test" test
          cp "$RUNNER_TEMP/bak/pubspec.yaml" pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="Buku Utang Warung"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependency
        run: flutter pub get

      - name: Jalankan test
        run: flutter test

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buku-utang-warung-apk
          path: build/app/outputs/flutter-apk/app-release.apk
