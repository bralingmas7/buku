name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Buat scaffold Android tanpa kehilangan kode aplikasi
      - name: Buat scaffold Android
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/bak"
          cp -r lib test pubspec.yaml "$RUNNER_TEMP/bak/"

          flutter create --platforms=android \
            --org id.warung \
            --project-name buku_utang_warung .

          rm -rf lib test pubspec.yaml
          cp -r "$RUNNER_TEMP/bak/lib" lib
          cp -r "$RUNNER_TEMP/bak/test" test
          cp "$RUNNER_TEMP/bak/pubspec.yaml" pubspec.yaml

          sed -i 's/android:label="[^"]*"/android:label="Buku Utang Warung"/' \
            android/app/src/main/AndroidManifest.xml

          # Kunci Android Keystore tidak boleh dipindahkan oleh Android Auto Backup.
          python3 - <<'PYSECURE'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          start = text.find("<application")
          if start < 0:
              raise SystemExit("Tag application tidak ditemukan.")

          end = text.find(">", start)
          if end < 0:
              raise SystemExit("Tag application tidak lengkap.")

          tag = text[start:end + 1]
          if "android:allowBackup=" in tag:
              raise SystemExit("allowBackup sudah diatur; periksa manual.")

          text = text[:end] + ' android:allowBackup="false"' + text[end:]
          manifest.write_text(text)
          print("Android Auto Backup dinonaktifkan.")
          PYSECURE


      # Siapkan keystore dari GitHub Secrets
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 belum tersedia"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks
          echo "Keystore berhasil disiapkan"

      # Konfigurasi signing Kotlin DSL
      - name: Konfigurasi signing Gradle
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          if not path.is_file():
              raise SystemExit("build.gradle.kts tidak ditemukan")

          text = path.read_text()

          android = list(re.finditer(r'(?m)^android\s*\{', text))
          if len(android) != 1:
              raise SystemExit("Blok android tidak ditemukan atau ambigu")

          if re.search(r'(?m)^[ \t]*signingConfigs\s*\{', text):
              raise SystemExit("Deklarasi signingConfigs sudah ada; hentikan untuk pemeriksaan manual")

          debug_pattern = re.compile(
              r'(?m)^([ \t]*)signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)[ \t]*$'
          )
          debug = list(debug_pattern.finditer(text))

          if len(debug) != 1:
              raise SystemExit("Referensi signing debug tidak ditemukan atau ambigu")

          indent = re.match(r'[ \t]*', text[android[0].start():]).group(0)
          child = indent + "    "
          grand = child + "    "

          signing = (
              "\n" + child + "signingConfigs {\n"
              + grand + 'create("release") {\n'
              + grand + '    keyAlias = System.getenv("KEY_ALIAS") ?: error("KEY_ALIAS belum tersedia")\n'
              + grand + '    keyPassword = System.getenv("KEY_PASSWORD") ?: error("KEY_PASSWORD belum tersedia")\n'
              + grand + '    storeFile = file(System.getenv("KEYSTORE_FILE") ?: error("KEYSTORE_FILE belum tersedia"))\n'
              + grand + '    storePassword = System.getenv("KEYSTORE_PASSWORD") ?: error("KEYSTORE_PASSWORD belum tersedia")\n'
              + grand + "}\n"
              + child + "}\n"
          )

          pos = android[0].end()
          text = text[:pos] + signing + text[pos:]

          text, count = debug_pattern.subn(
              r'\1signingConfig = signingConfigs.getByName("release")',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit("Penggantian signing gagal")

          path.write_text(text)
          print("Signing release berhasil dikonfigurasi")
          PY

      - name: Install dependency
        run: flutter pub get

      - name: Jalankan test
        run: flutter test

      # Build menggunakan keystore permanen
      - name: Build APK release
        env:
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release

      # Verifikasi tanda tangan dan SHA-1 sertifikat
      - name: Verifikasi APK
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          EXPECTED_SHA1="251bc0b80ca1d1db4053682abc45162792408b0b"

          test -s "$APK"

          APKSIGNER=$(find "${ANDROID_HOME:?ANDROID_HOME belum tersedia}/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          test -n "$APKSIGNER"

          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")

          printf '%s\n' "$CERT_INFO"

          ACTUAL_SHA1=$(printf '%s\n' "$CERT_INFO" \
            | sed -nE 's/.*certificate SHA-1 digest: ([[:xdigit:]:]+).*/\1/p' \
            | head -n 1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          if [ -z "$ACTUAL_SHA1" ]; then
            echo "ERROR: SHA-1 sertifikat tidak ditemukan"
            exit 1
          fi

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: SHA-1 sertifikat tidak cocok!"
            echo "Build dihentikan."
            exit 1
          fi

          echo "VERIFIKASI BERHASIL: SHA-1 cocok."

      # Upload APK agar bisa diunduh dari GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buku-utang-warung-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
