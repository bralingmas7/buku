name: buku_utang_warung
description: Buku utang pelanggan untuk pemilik warung. Offline, cepat, dan bisa tagih lewat WhatsApp.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  url_launcher: ^6.3.0
  file_picker: ^12.3.0

  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  cryptography: ^2.7.0
  shared_preferences: 2.3.1
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  gal: ^2.3.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: 2.3.3
  sqlite3: 2.4.0

flutter:
  uses-material-design: true
